<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuma Store - Juegos Digitales PS4 y PS5</title>
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: #0f111a;
            --text-color: #ffffff;
            --accent-red: #ff1a1a;
            --accent-ps5: #0072ce;
            --accent-ps4: #1f3c88;
            --neon-glow: #ff3333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background: linear-gradient(135deg, #1a0505, #050508);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.3);
        }

        .logo-container img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent-red);
            box-shadow: 0 0 15px var(--neon-glow);
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 2.3rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-glow);
            color: #fff;
        }

        header p {
            color: #b3b3b3;
            margin: 10px 0 0 0;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px auto;
            max-width: 800px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 12px 20px;
            background-color: var(--card-bg);
            border: 1px solid #2a1a1a;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 8px rgba(255, 26, 26, 0.5);
        }

        input { flex: 1; min-width: 200px; }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid #1f1515;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 26, 26, 0.25);
            border-color: var(--accent-red);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #222;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .platform-badge {
            align-self: flex-start;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-ps5 { background-color: var(--accent-ps5); }
        .badge-ps4 { background-color: var(--accent-ps4); }

        .card h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        
        .price {
            font-size: 1.4rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-buy {
            background: linear-gradient(90deg, #990000, var(--accent-red));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            transition: 0.2s;
        }

        .btn-buy:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 12px var(--neon-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Usamos tu logo subido temporalmente para la estructura -->
            <img src="logo.png" alt="Akuma Store Logo">
        </div>
        <h1>AKUMA STORE</h1>
        <p>Juegos Digitales Garantizados para PS4 y PS5</p>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Buscar tu juego favorito...">
        <select id="filter-platform">
            <option value="all">Todas las plataformas</option>
            <option value="ps5">PlayStation 5</option>
            <option value="ps4">PlayStation 4</option>
        </select>
    </div>

    <main class="catalog" id="catalog"></main>

    <script src="script.js"></script>
</body>
</html>
