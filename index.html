<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AKUMA STORE - Juegos PS3, PS4 y PS5">
    <title>AKUMA STORE</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo-container">
        <img src="logo.png" alt="AKUMA STORE" class="logo">
    </a>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#juegos">Juegos</a>
        <a href="#ofertas">Ofertas</a>
        <a href="admin.html">Admin</a>
    </nav>

    <button id="themeButton" class="theme-button">
        ☀️
    </button>

</header>


<main>

    <!-- BANNER -->

    <section id="inicio" class="hero">

        <div class="hero-content">

            <span class="hero-small">
                🎮 AKUMA STORE
            </span>

            <h1>
                LOS MEJORES<br>
                <span>JUEGOS</span>
            </h1>

            <p>
                PS3 • PS4 • PS5
            </p>

            <a href="#juegos" class="hero-button">
                VER JUEGOS
            </a>

        </div>

    </section>


    <!-- OFERTAS -->

    <section id="ofertas" class="section">

        <div class="section-title">
            <span>🔥</span>
            <h2>OFERTAS</h2>
        </div>

        <div id="offersCarousel" class="carousel">

            <button class="carousel-btn prev" onclick="previousOffer()">
                ❮
            </button>

            <div id="carouselContent"></div>

            <button class="carousel-btn next" onclick="nextOffer()">
                ❯
            </button>

        </div>

    </section>


    <!-- JUEGOS -->

    <section id="juegos" class="section">

        <div class="section-title">
            <span>🎮</span>
            <h2>NUESTROS JUEGOS</h2>
        </div>


        <div class="filters">

            <button class="filter active" data-console="todos">
                TODOS
            </button>

            <button class="filter" data-console="PS3">
                PS3
            </button>

            <button class="filter" data-console="PS4">
                PS4
            </button>

            <button class="filter" data-console="PS5">
                PS5
            </button>

        </div>


        <div id="gamesContainer" class="games-grid"></div>

    </section>

</main>


<footer>

    <img src="logo.png" alt="AKUMA STORE">

    <p>
        © 2026 AKUMA STORE
    </p>

    <p>
        PS3 • PS4 • PS5
    </p>

</footer>


<script src="app.js"></script>

</body>
  </html>
