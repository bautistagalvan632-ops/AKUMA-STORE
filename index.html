<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKUMA STORE</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">

  <a href="index.html" class="brand">
    <img src="assets/logo.png" alt="AKUMA STORE">
  </a>

  <nav>
    <a href="#catalogo">Juegos</a>
    <a href="#ofertas">Ofertas</a>
    <a href="admin.html">Admin</a>

    <button id="themeBtn" class="icon-btn">
      ☾
    </button>
  </nav>

</header>


<section class="hero">

  <div class="hero-content">

    <span class="eyebrow">
      AKUMA STORE
    </span>

    <h1>
      TU PRÓXIMA PARTIDA
      <strong>EMPIEZA ACÁ</strong>
    </h1>

    <p>
      Juegos de PS3, PS4 y PS5.
      Ofertas, novedades y destacados.
    </p>

    <a href="#ofertas" class="btn btn-red">
      VER OFERTAS
    </a>

  </div>

</section>


<section id="ofertas" class="section">

  <div class="section-head">

    <div>
      <span class="eyebrow">
        DESTACADOS
      </span>

      <h2>
        Ofertas de hoy
      </h2>
    </div>

  </div>

  <div id="offersCarousel" class="offers-carousel">

    <p>
      Cargando ofertas...
    </p>

  </div>

</section>


<section id="catalogo" class="section">

  <div class="section-head">

    <div>

      <span class="eyebrow">
        CATÁLOGO
      </span>

      <h2>
        Todos los juegos
      </h2>

    </div>

    <div class="filters">

      <button class="filter active" data-console="Todos">
        Todos
      </button>

      <button class="filter" data-console="PS3">
        PS3
      </button>

      <button class="filter" data-console="PS4">
        PS4
      </button>

      <button class="filter" data-console="PS5">
        PS5
      </button>

    </div>

  </div>


  <div id="gamesGrid" class="games-grid">

    <p>
      Cargando juegos...
    </p>

  </div>

</section>


<footer>

  <img src="assets/logo.png" alt="AKUMA STORE">

  <p>
    © 2026 AKUMA STORE
  </p>

</footer>


<script src="app.js"></script>

</body>
</html>
